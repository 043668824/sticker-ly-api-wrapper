name: sticker_hub
description: A comprehensive Flutter app for browsing, downloading, and adding stickers to WhatsApp using the Sticker.ly API
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  get: ^4.6.6
  
  # WhatsApp Integration
  whatsapp_stickers_plus: ^1.0.4
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.2
  
  # Image Loading & Caching
  cached_network_image: ^3.3.0
  
  # Storage & File Management
  path_provider: ^2.1.1
  sqflite: ^2.3.0
  get_storage: ^2.1.1
  
  # Permissions
  permission_handler: ^11.0.1
  
  # UI Enhancements
  lottie: ^2.7.0
  shimmer: ^3.0.0
  
  # Utilities
  image: ^4.1.3
  archive: ^3.4.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/animations/
    - assets/images/
    
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Bold.ttf
          weight: 700